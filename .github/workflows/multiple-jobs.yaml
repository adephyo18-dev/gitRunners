name: multiple-jobs workflow

on: push

env:
    CONTAINER_REGISTRY: ghcr.io
    DOCKER_IMAGE_NAME: my-docker-image
    DOCKER_USERNAME: ${{ github.actor }}
    DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
jobs:

    build_job_1:
        runs-on: ubuntu-latest
        steps:
            - name: Install cowsay program
              run: sudo apt-get update && sudo apt-get install -y cowsay

            - name: Execute Cowsay Command
              run: cowsay -f dragon "Run for cover! The dragon is coming!" >> dragon.txt

            - name: Upload dragon.txt as an artifact
              uses: actions/upload-artifact@v7
              with:
                  name: dragon-artifact
                  path: dragon.txt
    test_job_2:
        needs: build_job_1
        runs-on: ubuntu-latest
        steps:

            - name: Download dragon.txt artifact
              uses: actions/download-artifact@v8
              with:
                  name: dragon-artifact
                  path: dragon.txt

            - name: Search for the word "dragon" in dragon.txt
              run: grep -i "dragon" dragon.txt
            
            - name: Sleep for 10 seconds
              run: sleep 10

    deploy_job_3:
        needs: test_job_2
        runs-on: ubuntu-latest
        steps:

            - name: Checkout repo
              uses: actions/checkout@v3

            - name: Download dragon.txt artifact
              uses: actions/download-artifact@v8
              with:
                  name: dragon-artifact
                  path: dragon.txt

            - name: Display the contents of dragon.txt
              run: cat dragon.txt

            - name: List files in the current directory
              run: ls -ltra