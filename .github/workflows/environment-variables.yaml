name: environment-variables workflow

on: push

env:
    CONTAINER_REGISTRY: ghcr.io
    DOCKER_IMAGE_NAME: my-docker-image
  # DOCKER_USERNAME: ${{ vars['DOCKER_USERNAME'] }}
    # DOCKER_PASSWORD: ${{ secrets.DOCKER.DOCKER_PASSWORD }}

jobs:
    build_job:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Print environment variables
              run: |
                echo docker build -t $CONTAINER_REGISTRY/$DOCKER_IMAGE_NAME:latest .
                echo docker login $CONTAINER_REGISTRY -u ${{ vars['DOCKER_USERNAME'] }} -p '***'
                echo docker push $CONTAINER_REGISTRY/$DOCKER_IMAGE_NAME:latest
               
